name: keepalive

# FalkorDB Free instances stop after 1 day of inactivity and are deleted after
# 7 days. Judging can happen days after the demo was recorded, so this workflow
# pings the deployed app (which touches FalkorDB and re-seeds if a graph was
# lost) every 6 hours as a belt-and-braces backup to the Vercel Cron.
#
# Set the repo variable UNSPOOL_URL (defaults to the Vercel production URL) and,
# if you configured CRON_SECRET on Vercel, add the same value as a repo secret.

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch: {}

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping keep-alive endpoint
        env:
          URL: ${{ vars.UNSPOOL_URL || 'https://unspool-red.vercel.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          AUTH=()
          if [ -n "${CRON_SECRET:-}" ]; then AUTH=(-H "Authorization: Bearer ${CRON_SECRET}"); fi
          # Capture the body + status without letting curl fail the step first.
          BODY=$(curl -sS -m 60 -w '\n%{http_code}' "${AUTH[@]}" "${URL}/api/cron/keepalive")
          CODE=$(printf '%s' "$BODY" | tail -n1)
          PAYLOAD=$(printf '%s' "$BODY" | sed '$d')
          echo "HTTP $CODE"
          echo "$PAYLOAD"
          case "$CODE" in
            200) echo "keep-alive ok" ;;
            503) echo "::notice::FalkorDB is not configured yet — skipping. Set FALKORDB_URL on Vercel." ;;
            *)   echo "::error::keep-alive failed with HTTP $CODE"; exit 1 ;;
          esac
