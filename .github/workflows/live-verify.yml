name: live-verify

on:
  workflow_dispatch: {}
  schedule:
    # Weekly proof that every Cypher query still runs against a real FalkorDB
    # (and a free keep-alive touch for the demo instance).
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  verify:
    # Skip silently until a graph is configured for CI (repo secret FALKORDB_URL).
    if: ${{ secrets.FALKORDB_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      - name: Verify against live FalkorDB
        env:
          FALKORDB_URL: ${{ secrets.FALKORDB_URL }}
        run: bun run verify
