# Dependabot — unspool
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "actions/*"
          - "oven-sh/*"

  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      bun-deps:
        patterns:
          - "*"
        # Minor and patch only. The all-in-one group bundled typescript 5→7,
        # eslint 9→10 and @types/node 20→26 into a single PR whose CI cannot
        # pass, which turns the dependabot queue red and strands the safe
        # updates inside it. Major bumps now arrive as their own PRs, where the
        # breakage is isolated and reviewable one at a time.
        update-types:
          - "minor"
          - "patch"
